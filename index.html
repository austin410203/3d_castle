<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>沙堡潮汐 Sand &amp; Tide</title>
<meta name="description" content="three.js 互動沙灘：堆沙、挖護城河、倒沙桶蓋塔，看海浪湧進、沖垮你的沙堡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>

<header class="title">
  <h1>SAND<span>&amp;</span>TIDE</h1>
  <p>沙堡潮汐</p>
</header>

<div class="stars" id="stars" title="挖沙找到的寶物"><span>⭐</span><b id="starCount">0</b></div>

<nav class="tools" id="tools">
  <button data-tool="raise" class="on" title="堆沙 (1)"><i>⛰️</i><b>堆沙</b></button>
  <button data-tool="dig" title="挖溝 (2)"><i>🕳️</i><b>挖溝</b></button>
  <button data-tool="wall" title="城牆 (3)"><i>🧱</i><b>城牆</b></button>
  <button data-tool="tower" title="沙桶塔 (4)"><i><svg viewBox="0 0 32 32" width="28" height="28"><path d="M7 11h18l-2.4 16.2a2 2 0 0 1-2 1.8h-9.2a2 2 0 0 1-2-1.8z" fill="#e2402f"/><rect x="5.5" y="9" width="21" height="3.4" rx="1.6" fill="#b92e21"/><path d="M8 10.5C8 3.5 24 3.5 24 10.5" fill="none" stroke="#8a5a2b" stroke-width="1.8"/><path d="M11 16h10" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/></svg></i><b>沙桶塔</b></button>
  <button data-tool="smooth" title="抹平 (5)"><i>🧽</i><b>抹平</b></button>
  <button data-tool="decor" title="裝飾 (6)"><i>🐚</i><b>裝飾</b></button>
</nav>

<div class="decor" id="decor">
  <button data-d="flag" class="on">🚩<b>旗子</b></button>
  <button data-d="shell">🐚<b>貝殼</b></button>
  <button data-d="star">⭐<b>海星</b></button>
  <button data-d="pebble">🪨<b>卵石</b></button>
  <button data-d="wood">🪵<b>漂流木</b></button>
  <button data-d="weed">🌿<b>海草</b></button>
</div>

<section class="panel" id="panel">
  <label>潮汐<input id="tide" type="range" min="-0.45" max="0.55" step="0.01" value="0"></label>
  <label class="chk"><input id="autoTide" type="checkbox" checked>自動漲退潮</label>
  <label>筆刷<input id="brush" type="range" min="0.5" max="3" step="0.05" value="1.3"></label>
  <div class="row">
    <button id="wave" title="打一道大浪 (W)">🌊 大浪</button>
    <button id="demo" title="自動蓋一座沙堡 (B)">🏰 示範</button>
    <button id="reset" title="重置海灘 (R)">↺ 重置</button>
  </div>
</section>

<p class="hint" id="hint">左鍵塑沙・右鍵拖曳旋轉・中鍵平移・滾輪縮放・[ ] 調筆刷</p>
<div class="toast" id="toast"></div>

<script type="module" src="main.js"></script>
</body>
</html>
